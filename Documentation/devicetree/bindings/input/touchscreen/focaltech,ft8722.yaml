%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/focaltech,ft8722.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung A22x SPI touchscreen controller variants

description: |
  The A22x SPI touchscreen may use either a Himax HX83112F or FocalTech
  FT8722 controller. Both compatibles may be listed on the same SPI node;
  the drivers use the active panel name in the kernel command line to ensure
  only the matching driver binds.

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    oneOf:
      - const: focaltech,ft8722
      - items:
          - const: himax,hx83112f
          - const: himax,common
          - const: focaltech,ft8722

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupts-extended:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  spi-max-frequency: true
  touchscreen-size-x: true
  touchscreen-size-y: true
  touchscreen-inverted-x: true
  touchscreen-inverted-y: true
  touchscreen-swapped-x-y: true

required:
  - compatible
  - reg
  - reset-gpios
  - touchscreen-size-x
  - touchscreen-size-y

oneOf:
  - required:
      - interrupts
  - required:
      - interrupts-extended

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    spi {
      #address-cells = <1>;
      #size-cells = <0>;

      touchscreen@0 {
        compatible = "himax,hx83112f", "himax,common", "focaltech,ft8722";
        reg = <0>;
        spi-max-frequency = <9600000>;
        interrupt-parent = <&gpio>;
        interrupts = <14 IRQ_TYPE_EDGE_FALLING>;
        reset-gpios = <&gpio 15 GPIO_ACTIVE_LOW>;
        touchscreen-size-x = <1080>;
        touchscreen-size-y = <2408>;
      };
    };

...
